server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Приложение собрано с base: '/rect-tg-loyalty-app/'
    location = / {
        return 302 /rect-tg-loyalty-app/;
    }

    # Хэшированные ассеты можно кэшировать надолго
    location /rect-tg-loyalty-app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-роутинг: любой неизвестный путь отдаём в index.html
    location /rect-tg-loyalty-app/ {
        try_files $uri $uri/ /rect-tg-loyalty-app/index.html;
    }

    location = /rect-tg-loyalty-app/index.html {
        add_header Cache-Control "no-cache";
    }
}
